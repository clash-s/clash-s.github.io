name: Replace Clash Path

on:
  workflow_dispatch:
  push:
    branches: [ main ] # Change to your default branch if different

jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and replace text
        run: |
          find . -type f -not -path '*/.git*' -exec sed -i 's#clash-s/#clashv2rayu/#g' {} +

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: replace clash-s/ with clashv2rayu/" && git push)
