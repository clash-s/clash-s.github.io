name: Replace Clash Path Back

on:
  workflow_dispatch:
  push:
    branches: [ main ] # 如果你的默认分支不是 main，请修改此处

jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and replace text
        run: |
          find . -type f -not -path '*/.git*' -exec sed -i 's#clashv2rayu/#clash-s/#g' {} +

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: replace clashv2rayu/ with clash-s/" && git push)
